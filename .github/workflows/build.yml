name: Build

# Manual runs build the selected components and keep them as workflow artifacts.
# Pushing a v* tag builds everything and creates a draft pre-release with the packaged files.
on:
  workflow_dispatch:
    inputs:
      components:
        description: Components to build
        type: choice
        options: [both, turnip, proton]
        default: both
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  turnip:
    if: github.event_name == 'push' || inputs.components != 'proton'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Build Turnip
        run: scripts/build-turnip.sh

      - name: Archive the build output
        run: tar -C out -cf - turnip | zstd -T0 -3 -q -o turnip-out.tar.zst

      - uses: actions/upload-artifact@v7
        with:
          name: turnip-out
          path: turnip-out.tar.zst
          compression-level: 0
          retention-days: 14

  proton:
    if: github.event_name == 'push' || inputs.components != 'turnip'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - name: Disk space before cleanup
        run: df -h

      # The Proton build needs about 25 GB for its tree plus the SDK image and outputs. The ARM64 runner had
      # 108 GB free (145 GB disk) in October 2026, so this is only a safety margin; it takes about 25 s.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
              /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/lib/node_modules \
              /opt/microsoft /opt/google /usr/lib/jvm /usr/local/julia* || true
          sudo docker system prune -af || true
          sudo apt-get clean
          df -h

      - name: Pick the build directory
        run: |
          # The filesystem with the most free space (some runner images have a large /mnt).
          best="$({ df --output=avail,target -B1M / /mnt 2>/dev/null || true; } | tail -n +2 | sort -n | tail -n 1 | awk '{print $2}')"
          best="${best%/}"
          sudo mkdir -p "$best/frame-build"
          sudo chown "$(id -u):$(id -g)" "$best/frame-build"
          echo "WORK=$best/frame-build" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$best/frame-build/ccache" >> "$GITHUB_ENV"
          echo "Building in $best/frame-build"

      - uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: proton-ccache-${{ github.run_id }}
          restore-keys: proton-ccache-

      - name: Build Proton
        run: scripts/build-proton.sh --ccache --work-dir "$WORK/proton"

      - name: Disk space after the build
        if: always()
        run: |
          df -h
          du -sh "$WORK"/* 2>/dev/null || true

      - name: Archive the build output
        # includes out/proton/sources (corresponding source, already compressed)
        run: tar -C out -cf - proton | zstd -T0 -3 -q -o proton-out.tar.zst

      - uses: actions/upload-artifact@v7
        with:
          name: proton-out
          path: proton-out.tar.zst
          compression-level: 0
          retention-days: 14

  release:
    if: github.event_name == 'push'
    needs: [turnip, proton]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Unpack the build outputs
        run: |
          mkdir -p out
          for f in artifacts/*/*-out.tar.zst; do zstd -dc "$f" | tar -C out -xf -; done
          ls out

      - name: Package
        run: scripts/package.sh --version "$GITHUB_REF_NAME"

      - name: Create a draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --prerelease --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes "Built by GitHub Actions: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              dist/*
